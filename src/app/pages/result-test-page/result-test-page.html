<mat-toolbar class="toolbar">
    <span class="brand">
        <mat-icon>balance</mat-icon>
        Smart Law
    </span>

    <span class="spacer"></span>

    <button mat-icon-button matTooltip="หน้าหลัก" (click)="goHome()">
        <mat-icon>home</mat-icon>
    </button>


    <!-- เมนู -->
    <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>menu</mat-icon>
    </button>

    <mat-menu #menu="matMenu">

        <!-- ยังไม่ได้ Login -->
        <button mat-menu-item *ngIf="!isLoggedIn" (click)="goToLogin()">
            <mat-icon>admin_panel_settings</mat-icon>
            <span>Login for admin</span>
        </button>

        <!-- Login แล้ว -->
        <button mat-menu-item *ngIf="isLoggedIn" (click)="goToUpload()">
            <mat-icon>upload_file</mat-icon>
            <span>อัปโหลดเอกสาร</span>
        </button>

        <button mat-menu-item *ngIf="isLoggedIn" (click)="goToTest()">
            <mat-icon>quiz</mat-icon>
            <span>ทดสอบ</span>
        </button>

        <button mat-menu-item *ngIf="isLoggedIn" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
        </button>

    </mat-menu>
</mat-toolbar>

<div class="page">
    <mat-card class="result-card">
        <h2 class="title">ผลการทดสอบ</h2>
        <p class="subtitle">ค่า Precision ที่ได้ 0.93 หรือ 93%</p>

        <div class="table-wrapper">
            <table class="result-table">
                <thead>
                    <tr>
                        <th>ข้อความ</th>
                        <th>ผลลัพธ์</th>
                        <th>การทำนาย</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let row of results">
                        <td>{{ row.text }}</td>
                        <td>{{ row.actual }}</td>
                        <td>{{ row.predicted }}</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- <div class="action-bottom">
            <button mat-raised-button color="primary">
                กลับบ้าน
            </button>
        </div> -->
    </mat-card>
</div>
