<div class="login-container">
    <mat-card class="login-card">

        <!-- หัวการ์ดสีกรมท่า -->
        <header class="login-header">
            <div class="login-icon"><mat-icon>admin_panel_settings</mat-icon></div>
            <h2>เข้าสู่ระบบผู้ดูแล</h2>
            <p class="subtitle">Smart Law Admin</p>
        </header>

        <form (ngSubmit)="login()" class="login-form">
            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Email</mat-label>

                <input matInput type="email" [(ngModel)]="email" name="email" [disabled]="loading"
                    autocomplete="email" />

                <mat-icon matSuffix>email</mat-icon>
            </mat-form-field>

            <mat-form-field appearance="outline" class="full-width">
                <mat-label>Password</mat-label>
                <input matInput [type]="showPassword ? 'text' : 'password'" [(ngModel)]="password" name="password"
                    [disabled]="loading" autocomplete="current-password" />
                <button mat-icon-button matSuffix type="button" (click)="showPassword = !showPassword"
                    [attr.aria-label]="'Toggle password visibility'">
                    <mat-icon>{{ showPassword ? 'visibility_off' : 'visibility' }}</mat-icon>
                </button>
            </mat-form-field>

            <p *ngIf="error" class="error-text">
                <mat-icon>error_outline</mat-icon> {{ error }}
            </p>

            <button mat-flat-button type="submit" class="login-button full-width" [disabled]="loading">
                <mat-spinner *ngIf="loading" diameter="20" class="btn-spinner"></mat-spinner>
                <span *ngIf="!loading">เข้าสู่ระบบ</span>
                <span *ngIf="loading">กำลังเข้าสู่ระบบ...</span>
            </button>

            <button mat-button type="button" class="back-button full-width" (click)="goBack()">
                <mat-icon>arrow_back</mat-icon>
                กลับหน้าหลัก
            </button>
        </form>
    </mat-card>
</div>
