<mat-toolbar class="toolbar">
    <span class="brand">
        <mat-icon>balance</mat-icon>
        Smart Law
    </span>

    <span class="spacer"></span>

    <button mat-icon-button matTooltip="หน้าหลัก" (click)="goHome()">
        <mat-icon>home</mat-icon>
    </button>

    <button mat-icon-button (click)="logout()" matTooltip="Logout">
        <mat-icon>logout</mat-icon>
    </button>
</mat-toolbar>

<div class="page">
    <mat-card class="admin-card">
        <h2 class="title">จัดการแอดมิน</h2>
        <p class="subtitle">เฉพาะ Super Admin เท่านั้นที่สร้าง/ลบ admin ธรรมดาได้</p>

        <!-- ฟอร์มสร้าง admin ใหม่ -->
        <div class="create-form">
            <mat-form-field appearance="outline" class="email-field">
                <mat-label>อีเมล admin ใหม่</mat-label>
                <input matInput [(ngModel)]="newEmail" [disabled]="creating" autocomplete="off" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="password-field">
                <mat-label>รหัสผ่าน</mat-label>
                <input matInput type="password" [(ngModel)]="newPassword" [disabled]="creating" autocomplete="new-password" />
            </mat-form-field>

            <button mat-raised-button color="primary" [disabled]="creating" (click)="createAdmin()">
                <mat-spinner *ngIf="creating" diameter="20" class="btn-spinner"></mat-spinner>
                <mat-icon *ngIf="!creating">person_add</mat-icon>
                <span *ngIf="!creating">สร้าง admin</span>
            </button>
        </div>

        <!-- รายชื่อ admin ทั้งหมด -->
        <div class="list-section">
            <h3>รายชื่อ admin ทั้งหมด</h3>

            <div *ngIf="loadingList" class="status-row">
                <mat-spinner diameter="22"></mat-spinner>
                <span>กำลังโหลด...</span>
            </div>

            <div class="admin-item" *ngFor="let a of admins">
                <span class="admin-email">{{ a.email }}</span>

                <mat-chip-listbox>
                    <mat-chip-option [selectable]="false" [class.super-chip]="a.role === 'super_admin'">
                        {{ a.role === 'super_admin' ? 'Super Admin' : 'Admin' }}
                    </mat-chip-option>
                </mat-chip-listbox>

                <button
                    *ngIf="a.role !== 'super_admin'"
                    mat-icon-button
                    color="warn"
                    matTooltip="ลบ admin นี้"
                    [disabled]="deletingEmail === a.email"
                    (click)="deleteAdmin(a.email)"
                >
                    <mat-spinner *ngIf="deletingEmail === a.email" diameter="18"></mat-spinner>
                    <mat-icon *ngIf="deletingEmail !== a.email">delete</mat-icon>
                </button>
            </div>
        </div>
    </mat-card>
</div>
