<app-header></app-header>
<div class="page">
    <mat-card class="admin-card">
        <header class="hero">
            <div class="hero-icon"><mat-icon>lock_reset</mat-icon></div>
            <h2 class="title">เปลี่ยนรหัสผ่าน</h2>
        </header>

        <div class="body">
            <p class="account" *ngIf="!isSuperAdmin">บัญชี: <b>{{ email }}</b></p>

            <div class="form">
                <mat-form-field appearance="outline" *ngIf="isSuperAdmin">
                    <mat-label>เลือก admin</mat-label>
                    <mat-select [(ngModel)]="targetEmail" [disabled]="saving">
                        <mat-option *ngFor="let a of admins" [value]="a.email">{{ a.email }}</mat-option>
                    </mat-select>
                </mat-form-field>

                <mat-form-field appearance="outline" *ngIf="!isSuperAdmin">
                    <mat-label>รหัสผ่านเดิม</mat-label>
                    <input matInput type="password" [(ngModel)]="oldPassword" [disabled]="saving"
                        autocomplete="current-password" />
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>รหัสผ่านใหม่</mat-label>
                    <input matInput type="password" [(ngModel)]="newPassword" [disabled]="saving"
                        autocomplete="new-password" />
                </mat-form-field>

                <mat-form-field appearance="outline">
                    <mat-label>ยืนยันรหัสผ่านใหม่</mat-label>
                    <input matInput type="password" [(ngModel)]="confirmPassword" [disabled]="saving"
                        autocomplete="new-password" />
                </mat-form-field>

                <button mat-flat-button class="primary-btn" [disabled]="saving" (click)="submit()">
                    <mat-spinner *ngIf="saving" diameter="20" class="btn-spinner"></mat-spinner>
                    <span>{{ saving ? 'กำลังบันทึก...' : 'บันทึกรหัสผ่านใหม่' }}</span>
                </button>
            </div>
        </div>
    </mat-card>
</div>
