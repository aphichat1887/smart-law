<mat-toolbar class="toolbar">
    <span class="brand">
        <mat-icon>balance</mat-icon>
        Smart Law
    </span>

    <span class="spacer"></span>

    <button mat-icon-button matTooltip="หน้าหลัก" (click)="goHome()">
        <mat-icon>home</mat-icon>
    </button>


    <!-- เมนู -->
    <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>menu</mat-icon>
    </button>

    <mat-menu #menu="matMenu">

        <!-- ยังไม่ได้ Login -->
        <button mat-menu-item *ngIf="!isLoggedIn" (click)="goToLogin()">
            <mat-icon>admin_panel_settings</mat-icon>
            <span>Login for admin</span>
        </button>

        <!-- Login แล้ว -->
        <button mat-menu-item *ngIf="isLoggedIn" (click)="goToUpload()">
            <mat-icon>upload_file</mat-icon>
            <span>อัปโหลดเอกสาร</span>
        </button>

        <button mat-menu-item *ngIf="isLoggedIn" (click)="goToTest()">
            <mat-icon>quiz</mat-icon>
            <span>ทดสอบ</span>
        </button>

        <button mat-menu-item *ngIf="isLoggedIn" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
        </button>

    </mat-menu>
</mat-toolbar>

<div class="page">
    <mat-card class="test-card">
        <h2 class="title">ทดสอบระบบ</h2>
        <p class="subtitle">อัปโหลดไฟล์ทดสอบ</p>

        <!-- file -->
        <div class="file-item">
            <span class="file-name">ทดสอบ.xls</span>

            <div class="actions">
                <button mat-mini-fab color="accent">
                    <mat-icon>edit</mat-icon>
                </button>
                <button mat-mini-fab color="warn">
                    <mat-icon>delete</mat-icon>
                </button>
            </div>
        </div>

        <!-- upload -->
        <div class="upload-area">
            <button mat-raised-button color="primary">
                <mat-icon>upload</mat-icon>
                Upload
            </button>
        </div>

        <!-- result -->
        <div class="result">
            ค่า Precision ที่ได้ 0.93 หรือ 93%
        </div>

        <div class="action-bottom">
            <button mat-raised-button color="primary" (click)="goToResult()">
                <mat-icon>assessment</mat-icon>
                ผลการทดสอบ
            </button>
        </div>
    </mat-card>
</div>
