<mat-toolbar class="toolbar">
    <span class="brand">
        <mat-icon>balance</mat-icon>
        Smart Law
    </span>

    <span class="spacer"></span>

    <button mat-icon-button matTooltip="หน้าหลัก" (click)="goHome()">
        <mat-icon>home</mat-icon>
    </button>

    <!-- เมนู -->
    <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>menu</mat-icon>
    </button>

    <mat-menu #menu="matMenu">
        <!-- ยังไม่ได้ Login -->
        <button mat-menu-item *ngIf="!isLoggedIn" (click)="goToLogin()">
            <mat-icon>admin_panel_settings</mat-icon>
            <span>Login for admin</span>
        </button>

        <!-- Login แล้ว -->
        <button mat-menu-item *ngIf="isLoggedIn" (click)="goToUpload()">
            <mat-icon>upload_file</mat-icon>
            <span>อัปโหลดเอกสาร</span>
        </button>

        <button mat-menu-item *ngIf="isLoggedIn" (click)="goToTest()">
            <mat-icon>quiz</mat-icon>
            <span>ทดสอบ</span>
        </button>

        <button mat-menu-item *ngIf="isLoggedIn" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
        </button>
    </mat-menu>
</mat-toolbar>

<div class="page">
    <mat-card class="test-card">
        <h2 class="title">ทดสอบระบบ</h2>
        <p class="subtitle">
            อัปโหลดไฟล์ทดสอบ (.xlsx ต้องมีคอลัมน์ question และ article)
        </p>

        <!-- ไฟล์ที่เลือกล่าสุด -->
        <div class="file-item" *ngIf="selectedFileName">
            <span class="file-name">{{ selectedFileName }}</span>
        </div>

        <!-- ช่องเลือกไฟล์ที่ซ่อนไว้ -->
        <input #fileInput type="file" accept=".xlsx,.xls" hidden (change)="onFileSelected($event)" />

        <!-- upload -->
        <div class="upload-area">
            <button mat-raised-button color="primary" [disabled]="evaluating" (click)="openFilePicker()">
                <mat-spinner *ngIf="evaluating" diameter="20" class="btn-spinner"></mat-spinner>
                <mat-icon *ngIf="!evaluating">upload</mat-icon>
                <span *ngIf="!evaluating">Upload</span>
                <span *ngIf="evaluating">กำลังทดสอบ...</span>
            </button>
        </div>

        <!-- result -->
        <div class="result" *ngIf="hasResult && precisionText">
            ค่า Precision@K ที่ได้ {{ precisionText }}
        </div>

        <div class="action-bottom" *ngIf="hasResult">
            <button mat-raised-button color="primary" (click)="goToResult()">
                <mat-icon>assessment</mat-icon>
                ผลการทดสอบ
            </button>
        </div>
    </mat-card>
</div>
