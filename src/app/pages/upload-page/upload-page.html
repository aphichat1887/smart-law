<mat-toolbar class="toolbar">
    <span class="brand">
        <mat-icon>balance</mat-icon>
        Smart Law
    </span>

    <span class="spacer"></span>

    <button mat-icon-button matTooltip="หน้าหลัก" (click)="goHome()">
        <mat-icon>home</mat-icon>
    </button>


    <!-- เมนู -->
    <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>menu</mat-icon>
    </button>

    <mat-menu #menu="matMenu">

        <!-- ยังไม่ได้ Login -->
        <button mat-menu-item *ngIf="!isLoggedIn" (click)="goToLogin()">
            <mat-icon>admin_panel_settings</mat-icon>
            <span>Login for admin</span>
        </button>

        <!-- Login แล้ว -->
        <button mat-menu-item *ngIf="isLoggedIn" (click)="goToUpload()">
            <mat-icon>upload_file</mat-icon>
            <span>อัปโหลดเอกสาร</span>
        </button>

        <button mat-menu-item *ngIf="isLoggedIn" (click)="goToTest()">
            <mat-icon>quiz</mat-icon>
            <span>ทดสอบ</span>
        </button>

        <button mat-menu-item *ngIf="isLoggedIn" (click)="logout()">
            <mat-icon>logout</mat-icon>
            <span>Logout</span>
        </button>

    </mat-menu>
</mat-toolbar>

<div class="page">
    <mat-card class="file-card">
        <h2 class="title">File List</h2>

        <!-- file item -->
        <div class="file-item" *ngFor="let file of files">
            <span class="file-name">{{ file }}</span>

            <div class="actions">
                <button mat-mini-fab color="warn">
                    <mat-icon>delete</mat-icon>
                </button>
                <button mat-mini-fab color="accent">
                    <mat-icon>edit</mat-icon>
                </button>
            </div>
        </div>

        <div class="upload-area">
            <button mat-raised-button color="primary">
                <mat-icon>upload</mat-icon>
                Upload
            </button>
        </div>
    </mat-card>
</div>
